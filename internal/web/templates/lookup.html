{{template "header" .}}
<div class="lookup" data-product-search>
  <form method="get" action="/">
    <label class="sr" for="q">Find a product</label>
    <input id="q" name="q" type="search" value="{{.Page.Query}}" placeholder="Find a product" autocomplete="off" autofocus>
  </form>
  <div data-suggest>
    {{template "lookup_suggestions.html" .}}
  </div>
</div>
{{template "footer" .}}
