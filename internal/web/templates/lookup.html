{{template "header" .}}
<div class="lookup" data-product-search>
  <label class="sr" for="q">Find a product</label>
  <input id="q" name="q" type="search" placeholder="Find a product" autocomplete="off" autofocus>
  <ul class="ledger lookup-results" data-suggest></ul>
  <p class="empty lookup-empty" data-suggest-empty hidden>No product matches.</p>
</div>
{{template "footer" .}}
