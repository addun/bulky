{{template "header" .}}
<h1>{{if .Purchase.IsPrice}}Edit price{{else}}Edit purchase{{end}}</h1>
<p class="lede">{{.Product.Name}} · {{.Product.UnitName}}</p>
<form class="stack" method="post" action="/purchases/{{.Purchase.ID}}" data-pack-form>
  {{if .Purchase.ReceiptID}}
  <p class="meta">From <a href="/receipts/{{.Purchase.ReceiptID}}">receipt {{.Purchase.ReceiptID}}</a></p>
  {{end}}
  <label>Date <input type="date" name="bought_on" required value="{{.Purchase.BoughtOn}}"></label>
  <label>Packages <input name="packages" required inputmode="decimal" value="{{qty .Purchase.FormPackages}}" data-pack-count></label>
  <label>Package size ({{.Product.UnitName}}) <input name="package_size" required inputmode="decimal" value="{{qty .Purchase.FormPackSize}}" data-pack-size></label>
  <p class="hint pack-total" data-pack-total hidden></p>
  <label>Amount ({{.Page.Currency}}) <input name="amount" required inputmode="decimal" value="{{.Purchase.Amount}}"></label>
  <label>
    Company
    <select name="company_id">
      <option value="">None</option>
      {{range .Companies}}
      <option value="{{.ID}}" {{if eq .ID $.Purchase.CompanyID}}selected{{end}}>{{.Label}}</option>
      {{end}}
    </select>
  </label>
  <fieldset class="kind-pick">
    <legend>Kind</legend>
    <label class="check"><input type="radio" name="kind" value="purchase" {{if .Purchase.IsPurchase}}checked{{end}}> Purchase</label>
    <label class="check"><input type="radio" name="kind" value="price" {{if .Purchase.IsPrice}}checked{{end}}> Price only</label>
  </fieldset>
  <div class="actions">
    <button type="submit" class="btn btn-tag">Save</button>
    <a href="/products/{{.Product.ID}}">Cancel</a>
  </div>
</form>
{{template "footer" .}}
