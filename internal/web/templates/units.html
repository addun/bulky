{{template "header" .}}
<h1>Units</h1>

<form class="inline" method="post" action="/admin/units">
  <label class="grow">New unit <input name="name" required placeholder="l, szt, bottle…"></label>
  <button type="submit" class="btn btn-tag">Add unit</button>
</form>

{{if not .Units}}
  <p class="empty">No units yet.</p>
{{else}}
  <ul class="units">
    {{range .Units}}
    <li>
      <span class="unit-name">{{.Name}}</span>
      <span class="meta">{{.ProductCount}} product{{if ne .ProductCount 1}}s{{end}}</span>
      <span class="tight">
        <a href="/admin/units/{{.ID}}/edit">Rename</a>
        {{if eq .ProductCount 0}}
          <a class="danger" href="/admin/units/{{.ID}}/delete">Delete</a>
        {{end}}
      </span>
    </li>
    {{end}}
  </ul>
{{end}}
{{template "footer" .}}
