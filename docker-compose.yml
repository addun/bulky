services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      ADDR: ":8080"
      CURRENCY: PLN
      CURRENCY_SYMBOL: zł
      TZ: Europe/Warsaw
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_BASE_URL: ${OCR_BASE_URL:-}
    volumes:
      - bulkly-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_ORIGIN: http://api:8080
      PORT: "3000"
      HOST: 0.0.0.0
    depends_on:
      - api

volumes:
  bulkly-data:
