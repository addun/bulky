services:
  bulkly:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      ADDR: ":8080"
      CURRENCY: PLN
      CURRENCY_SYMBOL: zł
      TZ: Europe/Warsaw
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_BASE_URL: ${OCR_BASE_URL:-}
    volumes:
      - bulkly-data:/data

volumes:
  bulkly-data:
