services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    env_file: .env
    volumes:
      - bulkly-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    env_file: .env
    depends_on:
      - api

volumes:
  bulkly-data:
